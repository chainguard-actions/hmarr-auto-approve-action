name: Test with explicit pull-request-number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          pull-request-number: "1"
          # github-token defaults to github.token (real token injected by harness)
          # GITHUB_REPOSITORY is a sentinel that doesn't exist, so the API call will 404
      - name: Assert action ran (fails gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (sentinel repo is not resolvable)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (sentinel repo resolved unexpectedly)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
